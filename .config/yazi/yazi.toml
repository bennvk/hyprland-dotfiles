[mgr]
ratio = [1, 3, 4]
linemode = "size_and_mtime"

[preview]
max_width = 1500
max_height = 750

[opener]
edit = [
  { run = "$EDITOR %s",   block = true,   desc = "Neovim" },
  { run = "codium %s",    orphan = true,  desc = "VSCodium" },
]
extract = [
  { run = '7z x "%s" -y', block = false,  desc = "7-Zip" }
]
python = [
  { run = "python3 %s",   desc = "Exécuter"},
]
bash = [
  { run = "bash %s",      desc = "Exécuter"},
]
view_image = [
  { run = "swayimg %s",   orphan = true,  desc = "Swayimg" },
]
view_document = [
  { run = '$BROWSER %s',  orphan = true,  desc = "Firefox" },
]

[open]
rules = [
  { url = "*.pdf",      use = "view_document" },
  { url = "*.html",     use = [ "edit", "view_document" ] },
  { url = "*.htm",      use = [ "edit", "view_document" ] },
  { url = "*.png",      use = "view_image" },
  { url = "*.jpg",      use = "view_image" },
  { url = "*.jpeg",     use = "view_image" },
  { url = "*.gif",      use = "view_image" },
  { url = "*.bmp",      use = "view_image" },
  { url = "*.tiff",     use = "view_image" },
  { url = "*.tif",      use = "view_image" },
  { url = "*.ico",      use = "view_image" },
  { url = "*.avif",     use = "view_image" },
  { url = "*.heif",     use = "view_image" },
  { url = "*.heic",     use = "view_image" },
  { url = "*.webp",     use = "view_image" },
  { url = "*.svg",      use = "view_image" },
  { url = "*.zip",      use = "extract" },
  { url = "*.7z",       use = "extract" },
  { url = "*.rar",      use = "extract" },
  { url = "*.tar",      use = "extract" },
  { url = "*.gz",       use = "extract" },
  { url = "*.xz",       use = "extract" },
  { url = "*.txt",      use = "edit" },
  { url = "*.md",       use = "edit" },
  { url = "*.markdown", use = "edit" },
  { url = "*.json",     use = "edit" },
  { url = "*.jsonc",    use = "edit" },
  { url = "*.sh",       use = [ "edit", "bash" ] },
  { url = "*.bash",     use = "edit" },
  { url = "*.zsh",      use = "edit" },
  { url = "*.py",       use = [ "edit", "python" ] },
  { url = "*.toml",     use = "edit" },
  { url = "*.yaml",     use = "edit" },
  { url = "*.yml",      use = "edit" },
  { url = "*.xml",      use = "edit" },
  { url = "*.csv",      use = "edit" },
  { url = "*.tsv",      use = "edit" },
  { url = "*.js",       use = "edit" },
  { url = "*.jsx",      use = "edit" },
  { url = "*.ts",       use = "edit" },
  { url = "*.tsx",      use = "edit" },
  { url = "*.vue",      use = "edit" },
  { url = "*.css",      use = "edit" },
  { url = "*.scss",     use = "edit" },
  { url = "*.sass",     use = "edit" },
  { url = "*.rs",       use = "edit" },
  { url = "*.go",       use = "edit" },
  { url = "*.c",        use = "edit" },
  { url = "*.h",        use = "edit" },
  { url = "*.cpp",      use = "edit" },
  { url = "*.hpp",      use = "edit" },
  { url = "*.java",     use = "edit" },
  { url = "*.kt",       use = "edit" },
  { url = "*.php",      use = "edit" },
  { url = "*.rb",       use = "edit" },
  { url = "*.swift",    use = "edit" },
  { url = "*.sql",      use = "edit" },
  { url = "*.lua",      use = "edit" },
  { url = "*.ini",      use = "edit" },
  { url = "*.conf",     use = "edit" },
  { url = "*.cfg",      use = "edit" },
  { url = "*.env",      use = "edit" },
  { url = "*.log",      use = "edit" },
  { url = "*",          use = "edit" },
]
